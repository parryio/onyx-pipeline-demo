name: ci-long

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * *"

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR deps
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e ".[ocr]"
      - name: Ensure long fixture exists
        run: test -f tests/fixtures_long/scanned_book.pdf
      - name: Demo (long)
        run: bash scripts/demo-long.sh --fixed
        env:
          CI: "true"
      - name: Validate
        run: onyx-validate --out ./runs/long
      - uses: actions/upload-artifact@v4
        with:
          name: runs-long
          path: runs/long
